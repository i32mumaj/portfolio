services:
  portfolio:
    image: i32mumaj/portfolio:latest
    build: .
    container_name: portfolio
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORTFOLIO_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
